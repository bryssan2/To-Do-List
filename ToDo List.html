<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My ToDo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet" />
    <link
      rel="shortcut icon"
      href="/Pictures/ToDoList Pics/paper_14203821.png"
      type="image/x-icon" />
    <link rel="stylesheet" href="ToDo List.css" />
  </head>
  <body>
    <header>
      <p>Libérez votre esprit, organisez votre vie</p>
      <p>
        To Do List
        <img
          src="/Pictures/ToDoList Pics/business_14362287.png"
          alt="ToDo List Icon" />
      </p>
    </header>
    <main>
      <section class="text-bar">
        <div class="input-text">
          <input
            id="inputText"
            type="text"
            placeholder="Ajouter une nouvelle tâche..." />
          <div class="btn">
            <button id="add">Ajouter</button>
          </div>
        </div>
        <div class="input-text-2">
          <input
            type="text"
            class="input-2"
            id="input-2"
            placeholder="JJ / MM / AAAA - HH:MM " />
          <div class="btn-2">
            <button id="add-2">Ajouter</button>
          </div>
          <img
            id="img-watch"
            src="/Pictures/ToDoList Pics/access_time_filled_23dp_E66A5C.svg"
            alt="watch-icon" />
          <input type="time" name="watch" id="time" />
          <img
            id="calendar"
            src="/Pictures/ToDoList Pics/event_note_23dp_E66A5C_FILL0_wght400_GRAD0_opsz24.svg"
            alt="event-note-icon" />
          <input type="date" name="calendar" id="date" />
        </div>
      </section>
      <section class="tasks-area">
        <div class="Box">
          <ul id="tasks">
            <h2>Liste de Tâches</h2>
          </ul>
        </div>
      </section>
    </main>
    <script src="./ToDo List.js"></script>
  </body>
</html>
